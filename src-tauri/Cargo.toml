[package]
name = "wave"
version = "1.1.0"
description = "Wave: a text-based audio editor for podcasts"
authors = ["Saleh"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the WebView stops painting its own white background, so the
# window's dark one (tauri.conf.json `backgroundColor`) shows wherever the page
# hasn't drawn yet. It uses a private API, which the Mac App Store doesn't allow.
# Keep tauri's minor in step with @tauri-apps/api and @tauri-apps/cli (package.json):
# the CLI refuses mismatched minors.
tauri = { version = "~2.12", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros", "net", "time"] }
tauri-plugin-dialog = "2"
symphonia = { version = "0.5", features = ["all"] }
rubato = "1"
realfft = "3"
audioadapter-buffers = "2"
hound = "3"
# Loads LAME (the MP3 encoder) at run time from its own library: lame.rs.
libloading = "0.8"
uuid = { version = "1", features = ["v4"] }
whisper-rs = { version = "0.16", features = ["metal"] }
ort = "=2.0.0-rc.13"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
libc = "0.2"

# `tauri dev` builds are optimised, so audio and model code runs near release
# speed: unoptimised, importing a 43-minute MP3 took minutes (symphonia, and
# rubato's generic resampler, which compiles into Wave's own crate). Measured:
# decode + resample 1.3 s + 2.2 s, against 1.5 s + 0.9 s in release. Wave's
# crate gets opt-level 1 only, so an edit still rebuilds in seconds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# Proc macros and build scripts aren't stripped in release builds. Stripped,
# this macOS refuses to load the proc-macro dylibs ("mis-aligned LINKEDIT string
# pool"), so the build fails with "can't find crate for tauri_macros". They
# only run while compiling; the app itself is stripped as usual.
[profile.release.build-override]
strip = false
